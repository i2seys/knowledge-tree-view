let sourceMode='none',directoryHandle=null,loading=false,apiRevision='',sourceLabel='',apiFailures=0,lastFilePicker='folder-input';

function sourceStatus(text,error=false){$('source').textContent=text;$('source').classList.toggle('error',error);}

async function recordsFromFiles(files){
  const records=[],errors=[];for(let i=0;i<files.length;i+=24){await Promise.all(files.slice(i,i+24).map(async({file,path})=>{try{const header=await file.slice(0,65536).text();records.push(KnowledgeTreeData.parseHeader(header,path));}catch(e){errors.push(e.message);}}));}

}
async function walkHandle(handle,prefix=''){
  const files=[];for await(const[name,entry]of handle.entries()){if(name.startsWith('.'))continue;const path=prefix+name;if(entry.kind==='directory')files.push(...await walkHandle(entry,path+'/'));else if(/\.md$/i.test(name))files.push({file:await entry.getFile(),path});}return files;

async function readDirectory(){
